<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>볼 파이트 - 크리에이터 대난투 에디션 (팀전 업데이트)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #1e1e24;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    user-select: none;
  }
  h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.02em; color: #f1c40f; }
  .credit { font-size: 11px; color: #aaa; margin-bottom: 8px; }
  
  #arenaWrap {
    position: relative;
    width: min(94vw, 420px);
    aspect-ratio: 1;
    border: 4px solid #f1c40f;
    background: #111;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    padding: 6px;
    background: rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 5;
    gap: 4px;
  }
  .hud-item {
    width: 23%;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 2px 4px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .hpBox {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border-radius: 2px;
    overflow: hidden;
    height: 8px;
  }
  .hpBar { height: 100%; width: 100%; transition: width 0.15s; background: #2ecc71; }
  .hpLabel { font-size: 9px; font-weight: 700; text-align: center; margin-top: 1px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls {
    width: min(94vw, 420px);
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .mode-select {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .mode-btn {
    flex: 1; min-width: 30%;
    height: 32px;
    border: 2px solid #444;
    border-radius: 6px;
    background: #2c2c35;
    color: #bbb;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-btn.active {
    background: #f1c40f;
    color: #111;
    border-color: #f39c12;
  }

  .row { display: flex; gap: 8px; }
  .slot {
    flex: 1;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 6px;
    text-align: center;
    background: #2c2c35;
    cursor: pointer;
    min-height: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .slot.empty { color: #888; }
  .slot .cname { font-weight: 700; font-size: 12px; color: #fff; }
  .slot .ctag { font-size: 9px; color: #aaa; }
  .avatar-img {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid #fff;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  button.main {
    width: 100%; height: 44px;
    border: 2px solid #e67e22; border-radius: 8px;
    background: #e74c3c; color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: inherit; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
  }
  button.main:active { transform: translateY(1px); }
  button.main:disabled { background: #555; border-color: #444; cursor: not-allowed; }
  button.secondary {
    height: 36px; border: 2px solid #555; border-radius: 6px;
    background: #34495e; color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; padding: 0 10px; width: 100%;
  }

  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #2c2c35; width: min(100%, 440px); max-height: 78vh;
    border-radius: 16px 16px 0 0; overflow-y: auto; padding: 16px 14px 24px;
    border-top: 3px solid #f1c40f;
  }
  .modal h2 { font-size: 15px; margin-bottom: 12px; text-align: center; color: #f1c40f; }
  .charGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .charCard {
    border: 2px solid #444; border-radius: 10px; padding: 8px;
    cursor: pointer; background: #1e1e24; transition: background 0.12s;
  }
  .charCard:active { background: #333; }
  .charCard .top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .charCard .name { font-weight: 700; font-size: 12px; color: #fff; }
  .charCard .desc { font-size: 10px; color: #aaa; line-height: 1.3; }
  
  .result {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(17,17,17,0.9); z-index: 10;
    flex-direction: column; gap: 10px;
  }
  .result.show { display: flex; }
  .result .title { font-size: 26px; font-weight: 900; color: #f1c40f; }
  .result .sub { font-size: 14px; color: #ddd; }
</style>
</head>
<body>
  <div class="credit">볼 파이트 · 크리에이터 대난투 에디션</div>
  <h1 id="modeTitle">1:1 듀얼 모드</h1>

  <div id="arenaWrap">
    <div class="hud" id="hudContainer"></div>
    <canvas id="cv"></canvas>
    <div class="result" id="result">
      <div class="title" id="resTitle">승리!</div>
      <div class="sub" id="resSub"></div>
      <button class="secondary" style="width:140px;" onclick="resetFight()">메인으로</button>
    </div>
  </div>

  <div class="controls">
    <div class="mode-select">
      <button class="mode-btn active" onclick="setMode('1v1', event)">1:1 듀얼</button>
      <button class="mode-btn" onclick="setMode('2v2', event)">2:2 팀전</button>
      <button class="mode-btn" onclick="setMode('4v4', event)">4:4 팀전</button>
      <button class="mode-btn" onclick="setMode(4, event)">4인 난투</button>
      <button class="mode-btn" onclick="setMode(6, event)">6인 난투</button>
      <button class="mode-btn" onclick="setMode(8, event)">8인 난투</button>
    </div>
    
    <div class="row" id="slotRow">
      <div class="slot empty" id="slot0" onclick="openSelect(0)">
        <div class="avatar-img" style="background:#555;">+</div>
        <div class="cname">참가자 1</div>
      </div>
      <div class="slot empty" id="slot1" onclick="openSelect(1)">
        <div class="avatar-img" style="background:#555;">+</div>
        <div class="cname">참가자 2</div>
      </div>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="secondary" onclick="openCodex()">📖 크리에이터 도감</button>
      <button class="secondary" onclick="openUpdateNote()" style="background:#d35400; border-color:#e67e22;">📢 업데이트 노트</button>
    </div>
    <button class="main" id="startBtn" disabled onclick="startFight()">대난투 시작! ▶</button>
  </div>

  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeSelect()">
    <div class="modal">
      <h2>크리에이터 선택</h2>
      <div class="charGrid" id="charGrid"></div>
    </div>
  </div>

  <div class="modal-bg" id="codexModalBg" onclick="if(event.target===this)closeCodex()">
    <div class="modal">
      <h2>📖 크리에이터 도감</h2>
      <div class="charGrid" id="codexGrid"></div>
      <div style="margin-top: 12px;">
        <button class="secondary" onclick="closeCodex()">닫기</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="updateNoteModalBg" onclick="if(event.target===this)closeUpdateNote()">
    <div class="modal">
      <h2>📢 업데이트 노트</h2>
      <div style="font-size:11px; color:#ddd; line-height:1.5; display:flex; flex-direction:column; gap:6px;">
        <p><b>✨ 대규모 팀전 및 신규 캐릭터 업데이트</b></p>
        <p>• <b>2:2 / 4:4 팀전 모드 추가</b> (아군 피해 없음, 팀 승리 규칙)</p>
        <p>• <b>엄…에딧 이펙트 제거</b> 깔끔한 지진파 효과로 변경</p>
        <p>• <b>신규 캐릭터 5인 참전</b>: 류라이, 일오팔, 꽁시, 총몇몇, 뚜식이</p>
      </div>
      <div style="margin-top: 12px;">
        <button class="secondary" onclick="closeUpdateNote()">닫기</button>
      </div>
    </div>
  </div>

<script>
function makeSvgUrl(bg, emoji) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="${bg}"/><text x="60" y="75" font-size="50" text-anchor="middle">${emoji}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const SVG_KWON_L = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" fill="#2c3e50" rx="20"/><text x="80" y="70" font-size="22" font-weight="bold" fill="#e74c3c" text-anchor="middle">L을 가져가</text><text x="80" y="120" font-size="45" text-anchor="middle">🕺</text></svg>`);
const SVG_KWON_SELFIE = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" fill="#27ae60" rx="20"/><text x="80" y="70" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">셀카 📸</text><text x="80" y="120" font-size="45" text-anchor="middle">✌️</text></svg>`);

const imgKwonL = new Image(); imgKwonL.src = SVG_KWON_L;
const imgKwonSelfie = new Image(); imgKwonSelfie.src = SVG_KWON_SELFIE;

const CHARS = [
  {
    id: 'ryulai', name: '류라이', tag: '과일/성대모사', color: '#ff6b81', emoji: '🍓',
    hp: 260, speed: 1.35, desc: '딸기 날리기(70%), 수박 날리기(20%), 성대모사(10%, 슬로우+30딜)', skillCd: 5.0,
    skill: (me, foes) => {
      let r = Math.random();
      let target = getNearest(me, foes);
      if (r < 0.7) {
        if (target) projectiles.push({ x: me.x, y: me.y, tx: target.x, ty: target.y, speed: 400, r: 8, color: '#ff4757', owner: me, type: 'strawberry', dmg: 28 });
        floatText(me.x, me.y - 20, '딸기 날리기! 🍓', '#ff6b81');
      } else if (r < 0.9) {
        if (target) projectiles.push({ x: me.x, y: me.y, tx: target.x, ty: target.y, speed: 300, r: 16, color: '#2ed573', owner: me, type: 'watermelon', dmg: 60 });
        floatText(me.x, me.y - 20, '수박 날리기! 🍉', '#2ed573');
      } else {
        if (target) {
          damage(target, 30, me);
          target.slow = 3.0;
          floatText(me.x, me.y - 20, '성대모사! 슬로우 & 30딜 🗣️', '#ffa502');
        }
      }
    }
  },
  {
    id: 'ilofal', name: '일오팔', tag: '개그/아우라', color: '#576574', emoji: '🧢',
    hp: 280, speed: 1.4, desc: '패시브: 키작은 아우라 / 웃기기 원거리총알(50%) 또는 큰 총알 개그(50%)', skillCd: 4.8,
    skill: (me, foes) => {
      let target = getNearest(me, foes);
      if (!target) return;
      if (Math.random() < 0.5) {
        projectiles.push({ x: me.x, y: me.y, tx: target.x, ty: target.y, speed: 450, r: 7, color: '#f1c40f', owner: me, type: 'bullet', dmg: 35 });
        floatText(me.x, me.y - 20, '웃기기 총알 발사! 😂', '#f1c40f');
      } else {
        projectiles.push({ x: me.x, y: me.y, tx: target.x, ty: target.y, speed: 320, r: 18, color: '#e67e22', owner: me, type: 'bigBullet', dmg: 55 });
        floatText(me.x, me.y - 20, '엄청 큰 총알 개그! 💥', '#e67e22');
      }
    }
  },
  {
    id: 'ggongsi', name: '꽁시', tag: '변신/성대모사', color: '#3742fa', emoji: '🎭',
    hp: 270, speed: 1.3, desc: '분장하기 변신(30%, 4초), 성대모사 스킬 복사(30%, 3초), 웃기기 파동 3번(40%)', skillCd: 5.5,
    skill: (me, foes) => {
      let r = Math.random();
      let target = getNearest(me, foes);
      if (r < 0.3) {
        if (target) {
          me.originalEmoji = me.emoji;
          me.originalColor = me.color;
          me.emoji = target.emoji;
          me.color = target.color;
          me.transformTimer = 4.0;
          floatText(me.x, me.y - 20, `분장하기! ${target.name}로 변신! 🎭`, '#3742fa');
        }
      } else if (r < 0.6) {
        if (target && target.skill) {
          me.copySkillTimer = 3.0;
          me.copiedSkill = target.skill;
          floatText(me.x, me.y - 20, `성대모사하기! 3초간 기술 장착! ✨`, '#00d2d3');
        }
      } else {
        if (target) {
          for(let i=0; i<3; i++) {
            setTimeout(() => {
              let liveTarget = getNearest(me, foes);
              if(me.hp > 0 && liveTarget && liveTarget.hp > 0) {
                damage(liveTarget, 20, me);
                effects.push({ x: me.x, y: me.y, r: 10, maxR: 70, color: '#3742fa', life: 0.3, type: 'circle' });
              }
            }, i * 300);
          }
          floatText(me.x, me.y - 20, '웃기기 파동 공격 3연발! 🌊', '#3742fa');
        }
      }
    }
  },
  {
    id: 'chongmyeom', name: '총몇몇', tag: '애니메이션', color: '#ff5252', emoji: '🧑‍💼',
    hp: 270, speed: 1.3, desc: '퇴근후 혼밥 힐 30(30%), 공감 특 상대 스킬 3번(10%), 기묘함 속으로 정지(60%)', skillCd: 5.2,
    skill: (me, foes) => {
      let r = Math.random();
      let target = getNearest(me, foes);
      if (r < 0.3) {
        me.hp = Math.min(me.maxHp, me.hp + 30);
        floatText(me.x, me.y - 20, '퇴근 후 혼밥! 체력 +30 🍱', '#ff5252');
      } else if (r < 0.4) {
        if (target && target.skill) {
          for(let i=0; i<3; i++) {
            setTimeout(() => {
              let liveFoes = fighters.filter(o => o !== me && o.hp > 0 && (currentMode === '2v2' || currentMode === '4v4' ? o.team !== me.team : true));
              if(me.hp > 0 && liveFoes.length > 0) target.skill(me, liveFoes);
            }, i * 400);
          }
          floatText(me.x, me.y - 20, '공감 특! 상대 스킬 3번 시전! 🌀', '#ff5252');
        }
      } else {
        if (target) {
          target.freeze = 2.0;
          floatText(target.x, target.y - 20, '기묘함 속으로… 2초 정지! ⏳', '#ff5252');
        }
      }
    }
  },
  {
    id: 'ddusiki', name: '뚜식이', tag: '애니메이션', color: '#ffb142', emoji: '👦',
    hp: 280, speed: 1.35, desc: '원룸 소년단 5명 소환(10%), 사이다 반동10-넣기90(70%), 고구마 반동90-넣기10(20%)', skillCd: 5.5,
    skill: (me, foes) => {
      let r = Math.random();
      let target = getNearest(me, foes);
      if (r < 0.1) {
        for(let i=0; i<5; i++) {
          minions.push({ x: me.x + (Math.random()-0.5)*30, y: me.y + (Math.random()-0.5)*30, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, r: 12, life: 5.0, owner: me, hp: 10 });
        }
        floatText(me.x, me.y - 20, '원룸 소년단 5명 소환!! 🏠', '#ffb142');
      } else if (r < 0.8) {
        if (target) {
          damage(me, 10, me);
          damage(target, 90, me);
          floatText(me.x, me.y - 20, '시원한 사이다! (반동 10 / 90딜) 🥤', '#2ed573');
        }
      } else {
        if (target) {
          damage(me, 90, me);
          damage(target, 10, me);
          floatText(me.x, me.y - 20, '답답한 고구마… (반동 90 / 10딜) 🍠', '#e74c3c');
        }
      }
    }
  },
  {
    id: 'homekeeper', name: '홈키파', tag: '해충퇴치', color: '#16a085', emoji: '🧴',
    hp: 270, speed: 1.35, desc: '모기 소환(50%) 또는 홈키파 가스 분사(50%, 지속 딜)', skillCd: 5.0,
    skill: (me, foes) => {
      if (Math.random() < 0.5) {
        monsters.push({ x: me.x, y: me.y, vx: 6, vy: 6, r: 10, life: 6.0, owner: me, name: '모기' });
        floatText(me.x, me.y - 20, '위잉~ 모기 소환! 🦟', '#16a085');
      } else {
        lavas.push({ x: me.x, y: me.y, r: 75, life: 3.5, owner: me, isGas: true });
        floatText(me.x, me.y - 20, '치익-! 홈키파 분사! 💨', '#2ecc71');
      }
    }
  },
  {
    id: 'pajuyeopik', name: '파주여픽', tag: '라이더형', color: '#e17055', emoji: '🚲',
    hp: 280, speed: 1.5, desc: '패시브: 2초 작동/5초 휴식 자전거 3대(3딜) & 돌진 스킬', skillCd: 5.5,
    skill: (me, foes) => {
      let target = getNearest(me, foes);
      if(!target) return;
      projectiles.push({ x: me.x, y: me.y, tx: target.x, ty: target.y, speed: 400, r: 12, color: '#fab1a0', owner: me, type: 'bike', dmg: 38, slow: 3.0 });
      floatText(me.x, me.y - 20, '자전거 소환 돌진! 🚲', '#fab1a0');
    }
  },
  {
    id: 'eom', name: '엄…에딧', tag: '템버린', color: '#2d3436', emoji: '🛸',
    hp: 290, speed: 1.2, desc: '템버린 외계인 지진(50%) 또는 5초간 이속·딜 2배 개굴개굴(50%)', skillCd: 6.5,
    skill: (me, foes) => {
      if (Math.random() < 0.5) {
        foes.forEach(f => { damage(f, 45, me); f.freeze = 1.0; });
        effects.push({ x: me.x, y: me.y, r: 10, maxR: 180, color: '#636e72', life: 0.5, type: 'circle' });
        floatText(me.x, me.y - 20, '템버린 외계인 지진! 🛸', '#636e72');
      } else {
        me.speedBoostTimer = 5.0;
        me.doubleDmg = 5.0;
        floatText(me.x, me.y - 20, '개굴개굴! 이속·딜 2배! 🐸', '#00b894');
      }
    }
  },
  {
    id: 'kwonroot', name: '권루트', tag: '개그형', color: '#e84393', emoji: '😆',
    hp: 260, speed: 1.35, desc: 'L을 가져가(40%, 70딜) 또는 셀카 정지(60%)', skillCd: 6.5,
    skill: (me, foes) => {
      let target = getNearest(me, foes);
      if(!target) return;
      if (Math.random() < 0.4) {
        damage(target, 70, me);
        cutscenes.push({ img: imgKwonL, life: 0.9, maxLife: 0.9 });
        floatText(target.x, target.y - 20, 'L을 가져가라! 70딜! 💀', '#e84393');
      } else {

function getNearest(me, foes) {
  let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
  let alive = foes.filter(f => f !== me && f.hp > 0 && (!isTeamMode || f.team !== me.team));
  if(alive.length === 0) {
    alive = foes.filter(f => f !== me && f.hp > 0);
  }
  if(alive.length === 0) return null;
  let nearest = alive[0];
  let minD = Math.hypot(nearest.x - me.x, nearest.y - me.y);
  for(let i=1; i<alive.length; i++) {
    let d = Math.hypot(alive[i].x - me.x, alive[i].y - me.y);
    if(d < minD) { minD = d; nearest = alive[i]; }
  }
  return nearest;
}

let currentMode = '1v1';
let selectedSlots = [null, null];
let selectSlotIndex = 0;

let fighters = [], monsters = [], wells = [], floats = [], projectiles = [], effects = [], duoQuestions = [], foods = [], lavas = [], cutscenes = [], minions = [];
let running = false, lastT = 0;

function resize() {
  const wrap = document.getElementById('arenaWrap');
  const s = wrap.clientWidth;
  canvas.width = s; canvas.height = s;
  W = s; H = s; ARENA = s;
}
window.addEventListener('resize', resize);
resize();

function setMode(mode, e) {
  if (running) return;
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  if(e) e.target.classList.add('active');

  const row = document.getElementById('slotRow');
  row.innerHTML = '';
  
  if (mode === '1v1') {
    document.getElementById('modeTitle').textContent = '1:1 듀얼 모드';
    selectedSlots = [null, null];
    row.innerHTML = `
      <div class="slot empty" id="slot0" onclick="openSelect(0)"><div class="avatar-img" style="background:#555;">+</div><div class="cname">참가자 1</div></div>
      <div class="slot empty" id="slot1" onclick="openSelect(1)"><div class="avatar-img" style="background:#555;">+</div><div class="cname">참가자 2</div></div>
    `;
  } else if (mode === '2v2') {
    document.getElementById('modeTitle').textContent = '2:2 팀전 모드 (블루 vs 레드)';
    selectedSlots = [null, null, null, null];
    row.innerHTML = `
      <div class="slot empty" id="slot0" onclick="openSelect(0)"><div class="avatar-img" style="background:#3498db;">+</div><div class="cname">블루 1</div></div>
      <div class="slot empty" id="slot1" onclick="openSelect(1)"><div class="avatar-img" style="background:#3498db;">+</div><div class="cname">블루 2</div></div>
      <div class="slot empty" id="slot2" onclick="openSelect(2)"><div class="avatar-img" style="background:#e74c3c;">+</div><div class="cname">레드 1</div></div>
      <div class="slot empty" id="slot3" onclick="openSelect(3)"><div class="avatar-img" style="background:#e74c3c;">+</div><div class="cname">레드 2</div></div>
    `;
  } else if (mode === '4v4') {
    document.getElementById('modeTitle').textContent = '4:4 팀전 모드 (블루 vs 레드)';
    selectedSlots = new Array(8).fill(null);
    let html = '';
    for(let i=0; i<8; i++) {
      let teamColor = i < 4 ? '#3498db' : '#e74c3c';
      let teamName = i < 4 ? `블루 ${i+1}` : `레드 ${i-3}`;
      html += `<div class="slot empty" id="slot${i}" onclick="openSelect(${i})"><div class="avatar-img" style="background:${teamColor};">+</div><div class="cname">${teamName}</div></div>`;
    }
    row.innerHTML = html;
  } else {
    document.getElementById('modeTitle').textContent = `${mode}인 배틀로얄 대난투 모드`;
    selectedSlots = new Array(mode).fill(null);
    let html = '';
    for(let i=0; i<mode; i++) {
      html += `<div class="slot empty" id="slot${i}" onclick="openSelect(${i})"><div class="avatar-img" style="background:#555;">+</div><div class="cname">참가자 ${i+1}</div></div>`;
    }
    row.innerHTML = html;
  }
  document.getElementById('startBtn').disabled = true;
}

function openSelect(slotIdx) {
  if (running) return;
  selectSlotIndex = slotIdx;
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  CHARS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'charCard';
    card.innerHTML = `
      <div class="top">
        <img src="${c.svgUrl}" class="avatar-img">
        <div class="name">${c.name}</div>
      </div>
      <div class="desc">${c.tag} · HP ${c.hp}<br>${c.desc}</div>
    `;
    card.onclick = () => pickChar(c);
    grid.appendChild(card);
  });
  document.getElementById('modalBg').classList.add('show');
}
function closeSelect() { document.getElementById('modalBg').classList.remove('show'); }

function openCodex() {
  if (running) return;
  const grid = document.getElementById('codexGrid');
  grid.innerHTML = '';
  CHARS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'charCard';
    card.innerHTML = `
      <div class="top">
        <img src="${c.svgUrl}" class="avatar-img">
        <div class="name">${c.name}</div>
      </div>
      <div class="desc"><b>${c.tag}</b> · HP ${c.hp} · 쿨타임 ${c.skillCd}초<br>${c.desc}</div>
    `;
    grid.appendChild(card);
  });
  document.getElementById('codexModalBg').classList.add('show');
}
function closeCodex() { document.getElementById('codexModalBg').classList.remove('show'); }

function openUpdateNote() { document.getElementById('updateNoteModalBg').classList.add('show'); }
function closeUpdateNote() { document.getElementById('updateNoteModalBg').classList.remove('show'); }

function pickChar(c) {
  selectedSlots[selectSlotIndex] = c;
  const slot = document.getElementById('slot' + selectSlotIndex);
  slot.classList.remove('empty');
  slot.innerHTML = `
    <img src="${c.svgUrl}" class="avatar-img">
    <div class="cname">${c.name}</div>
    <div class="ctag">${c.tag}</div>
  `;
  closeSelect();
  let anyFilled = selectedSlots.some(s => s !== null);
  document.getElementById('startBtn').disabled = !anyFilled;
}

function updateHud() {
  const hud = document.getElementById('hudContainer');
  hud.innerHTML = '';
  fighters.forEach((f) => {
    let pct = Math.max(0, f.hp / f.maxHp * 100);
    let item = document.createElement('div');
    item.className = 'hud-item';
    item.innerHTML = `
      <div class="hpBox"><div class="hpBar" style="width:${pct}%;background:${f.hp > 0 ? '#2ecc71' : '#e74c3c'}"></div></div>
      <div class="hpLabel">${f.name}</div>
    `;
    hud.appendChild(item);
  });
}

function damage(target, amount, source) {
  if (target.hp <= 0) return;
  target.noDamageTimer = 0;
  
  if (target.shield && target.shield > 0) {
    floatText(target.x, target.y - 18, '방어막 방어!', '#ffb703');
    return;
  }
  let dmg = amount;
  if (target.weak) dmg *= 0.8;
  if (source && source.tripleDmgTimer > 0) dmg *= 3;
  if (source && source.blackBearTimer > 0) dmg *= 2;
  if (target.defense) dmg *= (1 - target.defense);
  dmg = Math.max(1, Math.round(dmg));
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    if (target.onDeath && target.onDeath(target)) {} 
    else { checkEndGame(); }
  }
}

function checkEndGame() {
  if (currentMode === '2v2' || currentMode === '4v4') {
    let t0Alive = fighters.filter(f => f.team === 0 && f.hp > 0).length;
    let t1Alive = fighters.filter(f => f.team === 1 && f.hp > 0).length;
    if (t0Alive === 0 || t1Alive === 0) {
      running = false;
      let winnerTeam = t0Alive > 0 ? '블루 팀' : '레드 팀';
      document.getElementById('resTitle').textContent = `${winnerTeam} 승리! 🎉`;
      document.getElementById('resSub').textContent = '';
      document.getElementById('result').classList.add('show');
    }
  } else {
    let alive = fighters.filter(f => f.hp > 0);
    if (alive.length <= 1) {
      running = false;
      let winner = alive.length === 1 ? alive[0] : null;
      document.getElementById('resTitle').textContent = winner ? `${winner.name} 승리!` : '무승부!';
      document.getElementById('resSub').textContent = winner ? `남은 HP ${Math.round(winner.hp)}` : '';
      document.getElementById('result').classList.add('show');
    }
  }
}

function floatText(x, y, text, color) {
  floats.push({ x, y, text, color, life: 1.1, vy: -40 });
}

function resetFight() {
  document.getElementById('result').classList.remove('show');
  fighters = []; monsters = []; wells = []; floats = []; projectiles = []; effects = []; duoQuestions = []; foods = []; lavas = []; cutscenes = []; minions = [];
  running = false;
  document.getElementById('hudContainer').innerHTML = '';
  drawIdle();
}

function startFight() {
  for(let i=0; i<selectedSlots.length; i++) {
    if(!selectedSlots[i]) {
      selectedSlots[i] = CHARS[Math.floor(Math.random() * CHARS.length)];
    }
  }

  document.getElementById('result').classList.remove('show');
  monsters = []; wells = []; floats = []; projectiles = []; effects = []; duoQuestions = []; foods = []; lavas = []; cutscenes = []; minions = [];

  fighters = selectedSlots.map((c, idx) => {
    let angle = (idx / selectedSlots.length) * Math.PI * 2;
    let radius = W * 0.3;
    let team = 0;
    if (currentMode === '2v2') {
      team = idx < 2 ? 0 : 1;
    } else if (currentMode === '4v4') {
      team = idx < 4 ? 0 : 1;
    } else {
      team = idx;
    }

    return {
      ...c,
      x: W/2 + Math.cos(angle) * radius,
      y: H/2 + Math.sin(angle) * radius,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      r: W * 0.055,
      hp: c.hp, maxHp: c.hp,
      team: team,
      skillTimer: c.skillCd ? c.skillCd * (0.3 + Math.random() * 0.5) : 999,
      freeze: 0, slow: 0, shield: 0, weak: 0, doubleDmg: 0,
      revived: false, noDamageTimer: 0, isPowerRanger: false,
      speedBoostTimer: 0, tripleDmgTimer: 0, blackBearTimer: 0, bikesTimer: 0, bikeAngle: idx * 2, bikeCycle: 0,
      transformTimer: 0, copySkillTimer: 0, copiedSkill: null,
      onDeath: c.onDeath || null
    };
  });

  running = true;
  lastT = performance.now();
  updateHud();
  requestAnimationFrame(loop);
}

function loop(t) {
  if (!running) return;
  const dt = Math.min(0.033, (t - lastT) / 1000);
  lastT = t;

  fighters.forEach(f => {
    if (f.freeze > 0) f.freeze -= dt;
    if (f.slow > 0) f.slow -= dt;
    if (f.shield > 0) f.shield -= dt;
    if (f.weak > 0) f.weak -= dt;
    if (f.doubleDmg > 0) f.doubleDmg -= dt;
    if (f.speedBoostTimer > 0) f.speedBoostTimer -= dt;
    if (f.tripleDmgTimer > 0) f.tripleDmgTimer -= dt;
    if (f.blackBearTimer > 0) f.blackBearTimer -= dt;
    if (f.bikesTimer > 0) f.bikesTimer -= dt;
    if (f.transformTimer > 0) {
      f.transformTimer -= dt;
      if (f.transformTimer <= 0) {
        f.emoji = f.originalEmoji || f.emoji;
        f.color = f.originalColor || f.color;
      }
    }
    if (f.copySkillTimer > 0) {
      f.copySkillTimer -= dt;
      if (f.copySkillTimer <= 0) f.copiedSkill = null;
    }
    f.noDamageTimer += dt;

    if (f.id === 'kangseoyun' && !f.isPowerRanger && f.noDamageTimer >= 2.0) {
      f.isPowerRanger = true;
      f.name = '파워레인저';
      f.speed = 2.2;
      f.color = '#e74c3c';
      f.emoji = '⚡';
      floatText(f.x, f.y - 20, '파워레인저로 변신! ⚡', '#f1c40f');
    }

    if (f.id === 'pajuyeopik' && f.hp > 0) {
      f.bikeCycle = (f.bikeCycle || 0) + dt;
      if (f.bikeCycle >= 7.0) f.bikeCycle = 0;
      if (f.bikeCycle < 2.0) {
        f.bikeAngle = (f.bikeAngle || 0) + dt * 3;
        for (let bIdx = 0; bIdx < 3; bIdx++) {
          let offset = (bIdx * Math.PI * 2) / 3;
          let bx = f.x + Math.cos(f.bikeAngle + offset) * 45;
          let by = f.y + Math.sin(f.bikeAngle + offset) * 45;
          fighters.forEach(foe => {
            let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
            if (foe !== f && foe.hp > 0 && (!isTeamMode || foe.team !== f.team) && Math.hypot(foe.x - bx, foe.y - by) < foe.r + 15) {
              damage(foe, 3, f);
            }
          });
        }
      }
    }

    if (f.bikesTimer > 0 && f.hp > 0) {
      f.bikeAngle = (f.bikeAngle || 0) + dt * 3;
      for (let bIdx = 0; bIdx < 3; bIdx++) {
        let offset = (bIdx * Math.PI * 2) / 3;
        let bx = f.x + Math.cos(f.bikeAngle + offset) * 45;
        let by = f.y + Math.sin(f.bikeAngle + offset) * 45;
        fighters.forEach(foe => {
          let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
          if (foe !== f && foe.hp > 0 && (!isTeamMode || foe.team !== f.team) && Math.hypot(foe.x - bx, foe.y - by) < foe.r + 15) {
            damage(foe, 3, f);
          }
        });
      }
    }
  });

  foods.forEach(fd => {
    fd.life -= dt;
    fighters.forEach(f => {
      if (f.hp > 0 && Math.hypot(f.x - fd.x, f.y - fd.y) < f.r + f.r) {
        damage(f, 30, fd.owner);
        fd.eaten = true;
        floatText(f.x, f.y - 20, '음식을 밟았다! 30딜', '#e74c3c');
      }
    });
  });
  foods = foods.filter(fd => !fd.eaten && fd.life > 0);

  lavas.forEach(lv => {
    lv.life -= dt;
    fighters.forEach(f => {
      if (f.hp > 0 && Math.hypot(f.x - lv.x, f.y - lv.y) < lv.r) {
        if (Math.random() < dt * 2) {
          damage(f, lv.isGas ? 20 : 50, lv.owner);
          floatText(f.x, f.y - 20, lv.isGas ? '홈키파 감염! 20딜' : '용암 데미지! 50딜', lv.isGas ? '#2ecc71' : '#e74c3c');
        }
      }
    });
  });
  lavas = lavas.filter(lv => lv.life > 0);

  minions.forEach(m => {
    m.life -= dt;
    m.x += m.vx; m.y += m.vy;
    if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
    if (m.y < m.r || m.y > H - m.r) m.vy *= -1;
    fighters.forEach(f => {
      let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
      if (f !== m.owner && f.hp > 0 && (!isTeamMode || f.team !== m.owner.team) && Math.hypot(f.x - m.x, f.y - m.y) < f.r + m.r) {
        damage(f, 4, m.owner);
      }
    });
  });
  minions = minions.filter(m => m.life > 0);

  duoQuestions.forEach(q => {
    q.life -= dt;
    if (q.life <= 0 && !q.done) {
      q.done = true;
      fighters.forEach(f => {
        if (f !== q.owner && f.hp > 0) {
          let boxIndex = f.x < W / 2 ? 0 : 1;
          if (boxIndex === q.correctBox) {
            damage(f, 0, q.owner);
            floatText(f.x, f.y - 20, '정답! 딜 0 ⭕', '#2ecc71');
          } else {
            damage(f, 50, q.owner);
            floatText(f.x, f.y - 20, '오답! 딜 50 ❌', '#e74c3c');
          }
        }
      });
    }
  });
  duoQuestions = duoQuestions.filter(q => !q.done);

  fighters.forEach(f => {
    if (f.hp <= 0 || f.freeze > 0) return;
    let spd = f.speed * (W / 400) * 120;
    if (f.slow > 0) spd *= 0.5;
    if (f.speedBoostTimer > 0) spd *= 2.0;
    
    let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
    let aliveFoes = fighters.filter(other => other !== f && other.hp > 0 && (!isTeamMode || other.team !== f.team));
    if (aliveFoes.length === 0) aliveFoes = fighters.filter(other => other !== f && other.hp > 0);

    if (aliveFoes.length > 0) {
      let nearest = aliveFoes[0];
      let minD = Math.hypot(nearest.x - f.x, nearest.y - f.y);
      for(let i=1; i<aliveFoes.length; i++) {
        let d = Math.hypot(aliveFoes[i].x - f.x, aliveFoes[i].y - f.y);
        if(d < minD) { minD = d; nearest = aliveFoes[i]; }
      }
      let angTo = Math.atan2(nearest.y - f.y, nearest.x - f.x);
      f.vx += Math.cos(angTo) * 0.6 + (Math.random() - 0.5) * 0.8;
      f.vy += Math.sin(angTo) * 0.6 + (Math.random() - 0.5) * 0.8;
    }
    
    const maxV = spd * 0.09;
    const v = Math.hypot(f.vx, f.vy);
    if (v > maxV) { f.vx *= maxV / v; f.vy *= maxV / v; }
    
    f.x += f.vx; f.y += f.vy;

    const bounce = 1.04;
    if (f.x < f.r) { f.x = f.r; f.vx = Math.abs(f.vx) * bounce; }
    if (f.x > W - f.r) { f.x = W - f.r; f.vx = -Math.abs(f.vx) * bounce; }
    if (f.y < f.r + 30) { f.y = f.r + 30; f.vy = Math.abs(f.vy) * bounce; }
    if (f.y > H - f.r) { f.y = H - f.r; f.vy = -Math.abs(f.vy) * bounce; }
  });

  projectiles.forEach(p => {
    let ang = Math.atan2(p.ty - p.y, p.tx - p.x);
    p.x += Math.cos(ang) * p.speed * dt;
    p.y += Math.sin(ang) * p.speed * dt;

    fighters.forEach(f => {
      let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
      if (f !== p.owner && f.hp > 0 && (!isTeamMode || f.team !== p.owner.team) && Math.hypot(f.x - p.x, f.y - p.y) < f.r + p.r) {
        let dmg = p.dmg;
        if (p.owner.doubleDmg > 0) dmg *= 2;
        damage(f, dmg, p.owner);
        if (p.slow) f.slow = p.slow;
        if (p.freeze) f.freeze = p.freeze;
        p.hit = true;
      }
    });
  });
  projectiles = projectiles.filter(p => !p.hit && p.x >= 0 && p.x <= W && p.y >= 0 && p.y <= H);

  effects.forEach(e => {
    if(e.type === 'circle') e.r += (e.maxR - e.r) * 15 * dt;
    e.life -= dt;
  });
  effects = effects.filter(e => e.life > 0);

  monsters.forEach(m => {
    m.life -= dt;
    m.x += m.vx; m.y += m.vy;
    if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
    if (m.y < m.r || m.y > H - m.r) m.vy *= -1;
    fighters.forEach(f => {
      let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
      if (f !== m.owner && f.hp > 0 && (!isTeamMode || f.team !== m.owner.team) && Math.hypot(f.x - m.x, f.y - m.y) < f.r + m.r) {
        damage(f, m.name === '모기' ? 4 : 3, m.owner);
      }
    });
  });
  monsters = monsters.filter(m => m.life > 0);

  wells.forEach(w => {
    w.life -= dt;
    fighters.forEach(f => {
      let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
      if (f === w.owner || f.hp <= 0 || (isTeamMode && f.team === w.owner.team)) return;
      const d = Math.hypot(f.x - w.x, f.y - w.y);
      if (d < w.r) {
        f.vx += (w.x - f.x) / d * 2.2;
        f.vy += (w.y - f.y) / d * 2.2;
        if (Math.random() < dt * 5) damage(f, 5, w.owner);
      }
    });
  });
  wells = wells.filter(w => w.life > 0);

  for (let i = 0; i < fighters.length; i++) {
    for (let j = i + 1; j < fighters.length; j++) {
      let a = fighters[i], b = fighters[j];
      if (a.hp <= 0 || b.hp <= 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minD = a.r + b.r;
      if (dist < minD && dist > 0) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = minD - dist;
        a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
        
        const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
        const imp = (dvx * nx + dvy * ny);
        if (imp < 0) {
          a.vx -= imp * nx * 1.35; a.vy -= imp * ny * 1.35;
          b.vx += imp * nx * 1.35; b.vy += imp * ny * 1.35;
        }
        let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
        if (!isTeamMode || a.team !== b.team) {
          damage(a, 2, b); damage(b, 2, a);
        }
      }
    }
  }

  fighters.forEach(f => {
    if (f.hp <= 0 || f.freeze > 0) return;
    f.skillTimer -= dt;
    if (f.skillTimer <= 0) {
      f.skillTimer = f.skillCd || 5;
      let isTeamMode = (currentMode === '2v2' || currentMode === '4v4');
      let aliveFoes = fighters.filter(o => o !== f && o.hp > 0 && (!isTeamMode || o.team !== f.team));
      if (aliveFoes.length === 0) aliveFoes = fighters.filter(o => o !== f && o.hp > 0);
      if (aliveFoes.length > 0) {
        if (f.copiedSkill) {
          f.copiedSkill(f, aliveFoes);
        } else if (f.skill) {
          f.skill(f, aliveFoes);
        }
      }
    }
  });

  cutscenes.forEach(cs => cs.life -= dt);
  cutscenes = cutscenes.filter(cs => cs.life > 0);

  floats.forEach(ft => { ft.life -= dt; ft.y += ft.vy * dt; });
  floats = floats.filter(ft => ft.life > 0);

  updateHud();
  draw();
  if (running) requestAnimationFrame(loop);
}

function drawIdle() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#666';
  ctx.font = `600 ${Math.floor(W * 0.04)}px "Noto Sans KR", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('참가자를 선택하고 대난투를 시작하세요', W / 2, H / 2);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#16161c'; ctx.fillRect(0, 0, W, H);

  duoQuestions.forEach(q => {
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(46, 204, 113, 0.15)';
    ctx.fillRect(10, 40, W/2 - 15, H - 50);
    ctx.strokeStyle = '#2ecc71';
    ctx.strokeRect(10, 40, W/2 - 15, H - 50);

    ctx.fillStyle = 'rgba(231, 76, 60, 0.15)';
    ctx.fillRect(W/2 + 5, 40, W/2 - 15, H - 50);
    ctx.strokeStyle = '#e74c3c';
    ctx.strokeRect(W/2 + 5, 40, W/2 - 15, H - 50);

    ctx.font = 'bold 20px "Noto Sans KR"'; ctx.textAlign = 'center';
    ctx.fillStyle = '#2ecc71'; ctx.fillText('O (정답 구역)', W/4, 70);
    ctx.fillStyle = '#e74c3c'; ctx.fillText('X (오답 구역)', W*3/4, 70);
  });

  lavas.forEach(lv => {
    ctx.fillStyle = lv.isGas ? 'rgba(46, 204, 113, 0.35)' : 'rgba(231, 76, 60, 0.5)';
    ctx.beginPath(); ctx.arc(lv.x, lv.y, lv.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = lv.isGas ? '#2ecc71' : '#f1c40f'; ctx.stroke();
  });

  wells.forEach(w => {
    const g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
    g.addColorStop(0, 'rgba(108,92,231,0.8)'); g.addColorStop(1, 'rgba(108,92,231,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 2; ctx.stroke();
  });

  effects.forEach(e => {
    if (e.type === 'arc') {
      ctx.fillStyle = 'rgba(230, 126, 34, 0.85)';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, e.r, e.angle - Math.PI/2, e.angle + Math.PI/2);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.stroke();
    }
  });

  foods.forEach(fd => {
    ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍔', fd.x, fd.y);
  });

  projectiles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  });

  monsters.forEach(m => {
    ctx.fillStyle = m.name === '모기' ? '#27ae60' : '#00b4d8';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.font = '14px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(m.name === '고경태' ? '🧑‍💻' : (m.name === '모기' ? '🦟' : '👾'), m.x, m.y);
  });

  minions.forEach(mn => {
    ctx.fillStyle = '#ffb142';
    ctx.beginPath(); ctx.arc(mn.x, mn.y, mn.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.font = '12px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👦', mn.x, mn.y);
  });

  fighters.forEach((f) => {
    if (f.hp <= 0) return;
    
    if (f.id === 'pajuyeopik' && (f.bikeCycle || 0) < 2.0) {
      for (let bIdx = 0; bIdx < 3; bIdx++) {
        let offset = (bIdx * Math.PI * 2) / 3;
        let bx = f.x + Math.cos(f.bikeAngle + offset) * 45;
        let by = f.y + Math.sin(f.bikeAngle + offset) * 45;
        ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🚲', bx, by);
      }
    }

    if (f.bikesTimer > 0) {
      for (let bIdx = 0; bIdx < 3; bIdx++) {
        let offset = (bIdx * Math.PI * 2) / 3;
        let bx = f.x + Math.cos(f.bikeAngle + offset) * 45;
        let by = f.y + Math.sin(f.bikeAngle + offset) * 45;
        ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🚲', bx, by);
      }
    }

    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = f.color; ctx.fill();

    ctx.font = `${f.r}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji || '👤', f.x, f.y);

    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.lineWidth = 3; 
    let ringColor = '#f1c40f';
    if (currentMode === '2v2' || currentMode === '4v4') {
      ringColor = f.team === 0 ? '#3498db' : '#e74c3c';
    }
    ctx.strokeStyle = f.shield > 0 ? '#ffb703' : ringColor; 
    ctx.stroke();

    ctx.font = `700 ${Math.floor(W * 0.03)}px "Noto Sans KR", sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(f.name, f.x, f.y - f.r - 6);
  });

  cutscenes.forEach(cs => {
    let alpha = Math.min(1, cs.life * 2);
    ctx.save();
    ctx.globalAlpha = alpha;
    let imgW = W * 0.55;
    let imgH = W * 0.55;
    ctx.drawImage(cs.img, W / 2 - imgW / 2, H / 2 - imgH / 2, imgW, imgH);
    ctx.restore();
  });

  floats.forEach(ft => {
    ctx.globalAlpha = Math.min(1, ft.life * 1.5);
    ctx.font = `700 ${Math.floor(W * 0.035)}px "Noto Sans KR", sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
  });
}

drawIdle();
</script>
</body>
</html>
